[project]
name = "production-ai-research-agent"
version = "1.0.0"
description = "Production AI Research Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq",
    "pydantic",
    "pydantic-settings",
    "pydantic[email]",
    "chromadb",
    "rank-bm25",
    "numpy",
    "tiktoken",
    "PyMuPDF",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "mcp",
    "beautifulsoup4",
    "passlib[bcrypt]",
    "argon2-cffi",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx"
]
